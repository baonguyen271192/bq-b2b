spring:
  application:
    name: bq-api
  jackson:
    # Hợp đồng OpenAPI dùng snake_case (credit_limit, qty_total, over_limit...).
    # Đặt ở đây một lần thay vì rắc @JsonProperty khắp domain.
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

server:
  port: ${PORT:8100}

bq:
  # demo  = dữ liệu mẫu đóng gói trong resources/demo + SQLite
  # sapb1 = SAP Business One Service Layer
  # Đổi giá trị này KHÔNG cần sửa controller, service, frontend hay mobile.
  data-source: ${BQ_DATA_SOURCE:demo}

  demo:
    # DB demo thuộc về chính service này. Trước đây trỏ sang thư mục Python, nhưng
    # service Python đã thu lại chỉ còn trợ lý AI và không giữ dữ liệu nữa.
    orders-db: ${BQ_DEMO_ORDERS_DB:data/orders.db}

  sapb1:
    base-url: ${SAPB1_BASE_URL:}
    company-db: ${SAPB1_COMPANY_DB:}
    username: ${SAPB1_USERNAME:}
    password: ${SAPB1_PASSWORD:}
    # Bản cài nội bộ thường dùng cert tự ký. Chỉ tắt trong LAN/VPN tin cậy.
    verify-ssl: ${SAPB1_VERIFY_SSL:true}
    warehouse: ${SAPB1_WAREHOUSE:}
    page-size: 100
    # Mỗi lần đọc danh mục là một request sang ERP. Trang analytics và trợ lý AI đọc
    # danh mục liên tục, nên không cache thì không dùng được.
    # CHỈ cache danh mục — công nợ/số dư/tồn lúc chốt đơn luôn đọc tươi. 0 = tắt.
    catalog-cache-ttl: ${SAPB1_CATALOG_CACHE_TTL:PT5M}

    # Vòng đời đơn. BQ xác nhận SAP B1 của họ ĐÃ có đủ 5 trạng thái; B1 chuẩn chỉ có
    # Open/Closed nên chúng gần như chắc chắn nằm trong một UDF (trường U_...).
    # Điền hai dòng này là xong, không phải sửa code.
    order-status-field: ${SAPB1_ORDER_STATUS_FIELD:}
    order-status-values: ${SAPB1_ORDER_STATUS_VALUES:}

    # "Đôi nào được coi là bán được" — CHÍNH SÁCH BÁN HÀNG của BQ, không phải quyết
    # định kỹ thuật. Cả ba cách đều đã hiện thực sẵn, chỉ chọn:
    #   in_stock                 tồn thực tế (dễ bán vượt)
    #   available                tồn trừ phần đã giữ cho đơn khác  (mặc định)
    #   available_with_incoming  cộng thêm hàng đang về (bán trước)
    stock-formula: ${SAPB1_STOCK_FORMULA:available}

    # Tra SpecialPrices (giá riêng theo từng khách) ghi đè bảng giá. Tắt nếu BQ chỉ
    # dùng bảng giá — đỡ một request cho mỗi đại lý.
    use-special-prices: ${SAPB1_USE_SPECIAL_PRICES:true}

    # Thanh toán đối trừ vào hoá đơn (quy trình chuẩn) hay thẳng vào đơn hàng.
    payment-target: ${SAPB1_PAYMENT_TARGET:invoice}

  retail:
    # Khoá bot gửi ở header X-BQ-Retail-Key khi bắn đơn lẻ vào BQ.
    # ĐỂ TRỐNG = TẮT endpoint nhận đơn. Cố ý fail closed: endpoint này ghi
    # đơn THẬT, mở sẵn nghĩa là ai trên Internet cũng tạo được đơn cho BQ.
    ingest-key: ${BQ_RETAIL_INGEST_KEY:}

  assistant:
    # Trợ lý AI vẫn chạy ở service Python (apps/api). Java proxy sang.
    # PHẢI khác cổng của chính Java (server.port) — trỏ trùng = proxy gọi lại chính
    # mình, treo request. Mặc định: Java 8100, Python assistant 8101.
    base-url: ${BQ_ASSISTANT_URL:http://localhost:8101}

  cors:
    # Demo mở rộng. TRƯỚC KHI lên thật với dữ liệu SAP B1: liệt kê domain cụ thể.
    allowed-origins: ${BQ_CORS_ORIGINS:*}

springdoc:
  api-docs:
    path: /openapi.json          # trùng đường dẫn cũ của FastAPI, script pull không phải đổi
  swagger-ui:
    path: /docs
    # Giao diện Swagger hữu ích khi bàn giao cho team IT của BQ. TẮT ở môi trường
    # chạy thật với dữ liệu SAP B1: nó phơi bày toàn bộ bề mặt API ra ngoài.
    enabled: ${SPRINGDOC_UI_ENABLED:true}
  writer-with-order-by-keys: true   # khoá sắp xếp ổn định -> diff của openapi.json đọc được

management:
  endpoints:
    web:
      exposure:
        include: health,info
